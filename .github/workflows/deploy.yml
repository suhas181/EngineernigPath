name: CI/CD Pipeline - EngineerPath

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Type-Check Backend
  # ─────────────────────────────────────────────────────────────
  check-backend:
    name: Test & Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: TypeScript & Build Check
        run: |
          cd backend
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build & Type-Check Frontend
  # ─────────────────────────────────────────────────────────────
  check-frontend:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Auto-Deploy Backend to Render
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    needs: check-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "::warning ::RENDER_DEPLOY_HOOK_URL secret is not set. Skipping manual trigger (Render auto-deploy via GitHub integration will run)."
          else
            echo "Triggering Render backend deployment..."
            curl -s -X POST "$RENDER_HOOK"
            echo "Render deployment triggered successfully!"
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 4: Auto-Deploy Frontend to Vercel
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: check-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "::warning ::VERCEL_DEPLOY_HOOK_URL secret is not set. Skipping manual trigger (Vercel auto-deploy via GitHub integration will run)."
          else
            echo "Triggering Vercel frontend deployment..."
            curl -s -X POST "$VERCEL_HOOK"
            echo "Vercel deployment triggered successfully!"
          fi
