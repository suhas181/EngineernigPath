name: CI/CD Pipeline - EngineerPath

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Validate, Lint, Test & Build Backend
  # ─────────────────────────────────────────────────────────────
  validate-backend:
    name: Validate, Test & Build Backend
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Lint & Type-Check Backend
        run: |
          cd backend
          npm run lint

      - name: Run Standalone Unit & Scoring Tests
        env:
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_minimum_32_characters_long
        run: |
          cd backend
          npm run test:unit

      - name: Run Integration & Security Tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/engineerpath_test
          JWT_SECRET: ci_test_jwt_secret_key_minimum_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_minimum_32_characters_long
          CRON_SECRET: ci_test_cron_secret_minimum_16_chars
        run: |
          cd backend
          npm run test:integration

      - name: Build Backend Production Artifact
        run: |
          cd backend
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 2: Validate, Lint & Build Frontend
  # ─────────────────────────────────────────────────────────────
  validate-frontend:
    name: Validate, Lint & Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend Production Bundle
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
        run: |
          cd frontend
          if [ -z "$VITE_API_URL" ]; then
            echo "::error ::VITE_API_URL variable is not configured in GitHub Actions Repository Variables or Secrets. Frontend production build requires a valid public backend API URL."
            exit 1
          fi
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 3: Auto-Deploy Backend to Render (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    needs: [validate-backend, validate-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Backend Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "::error ::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub Repository Secrets. Production backend deployment failed."
            exit 1
          fi

          echo "Triggering Render backend deployment via deploy hook..."
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$RENDER_HOOK")
          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "Render deployment hook triggered successfully (HTTP $HTTP_RESPONSE)."
          else
            echo "::error ::Render deployment hook failed with HTTP status $HTTP_RESPONSE."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 4: Auto-Deploy Frontend to Vercel (main branch only)
  # ─────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    needs: [validate-backend, validate-frontend, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Frontend Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "::error ::VERCEL_DEPLOY_HOOK_URL secret is not configured in GitHub Repository Secrets. Production frontend deployment failed."
            exit 1
          fi

          echo "Triggering Vercel frontend deployment via deploy hook..."
          HTTP_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$VERCEL_HOOK")
          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 300 ]; then
            echo "Vercel deployment hook triggered successfully (HTTP $HTTP_RESPONSE)."
          else
            echo "::error ::Vercel deployment hook failed with HTTP status $HTTP_RESPONSE."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # Job 5: Post-Deployment Health Check (main branch only)
  # ─────────────────────────────────────────────────────────────
  verify-deployment:
    name: Verify Production Health
    needs: [deploy-backend, deploy-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify Live Backend Health
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error ::PRODUCTION_HEALTH_URL secret is not configured in GitHub Repository Secrets. Health verification failed."
            exit 1
          fi

          echo "Checking production health endpoint: $HEALTH_URL/health"
          SUCCESS=false
          for i in {1..12}; do
            echo "Attempt $i: Fetching $HEALTH_URL/health..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL/health" || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Production health check passed with HTTP 200 OK!"
              SUCCESS=true
              break
            fi
            echo "Service not ready yet (HTTP $STATUS). Waiting 10s..."
            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error ::Production health check timed out or returned non-200 status."
            exit 1
          fi
